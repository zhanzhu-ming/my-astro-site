<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="t d"><title id="t">Sourcing process illustration</title><desc id="d">A minimal diagram showing requirement, review, sample and confirmation stages.</desc><rect width="1400" height="650" fill="#273d32"/><path d="M160 320H1240" stroke="#879782" stroke-width="3" stroke-dasharray="8 14"/><g fill="#f1eee4" stroke="#d2c7ad" stroke-width="3"><circle cx="190" cy="320" r="82"/><circle cx="530" cy="320" r="82"/><circle cx="870" cy="320" r="82"/><circle cx="1210" cy="320" r="82"/></g><g fill="#30483a" font-family="Georgia,serif" font-size="54" text-anchor="middle"><text x="190" y="340">01</text><text x="530" y="340">02</text><text x="870" y="340">03</text><text x="1210" y="340">04</text></g><g fill="#e9e5d9" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" letter-spacing="3"><text x="190" y="470">BRIEF</text><text x="530" y="470">REVIEW</text><text x="870" y="470">SAMPLE</text><text x="1210" y="470">CONFIRM</text></g><text x="80" y="100" fill="#c7b997" font-family="Arial,sans-serif" font-size="22" letter-spacing="7">SHEERHERB  /  PROCUREMENT COORDINATION</text><text x="80" y="570" fill="#d6ded2" font-family="Georgia,serif" font-size="34">Clear requirements. Verifiable information. Written confirmation.</text></svg>
